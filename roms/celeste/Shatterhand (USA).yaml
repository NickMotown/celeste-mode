# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 1553M (Cardboard), on Shatterhand (USA), replayed in FCEUX 2.6.6.
variables:
  0x0002: Scene
  0x0006: Pad
  0x0055: Level
  0x05C5: Health
  0x05EB: Screen
  0x06F0: BossHealth
  0x071C: Lives
name: Shatterhand (USA)
rom: nes/Shatterhand (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Level 0 start
    when: "Level == 0x00 && Scene changed && Scene == 0x00"
    start: yes
  - name: Level 0 4
    when: "Level == 0x00 && Screen changed && Screen == 0x13"
    levels: easy
  - name: Level 0 5
    when: "Level == 0x00 && Screen changed && Screen == 0x14"
