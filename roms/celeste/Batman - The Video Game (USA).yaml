# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 6038M (DreamYao), on Batman (USA), replayed in FCEUX 2.6.6.
variables:
  0x0088: Stage
  0x00B6: GameState
  0x00B7: Health
  0x00BE: Lives
  0x00DA: Screen
  0x00F7: Pad
  0x05E0: BossHealth
name: Batman - The Video Game (USA)
rom: nes/Batman - The Video Game (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Stage 1-1 start
    when: "Stage == 0x00 && GameState was 0x00 && GameState == 0x01 || Stage == 0x00 && Stage changed"
    start: yes
  - name: Stage 1-1 4
    when: "Stage == 0x00 && Screen changed && Screen == 0x03"
    levels: easy medium
  - name: Stage 1-1 6
    when: "Stage == 0x00 && Screen changed && Screen == 0x05"
    levels: easy
  - name: Stage 1-2 start
    when: "Stage == 0x02 && Stage changed || Stage == 0x02 && GameState was 0x00 && GameState == 0x01"
    start: yes
  - name: Stage 1-2 3
    when: "Stage == 0x02 && Screen changed && Screen == 0x02"
    levels: easy medium
  - name: Stage 1-2 4
    when: "Stage == 0x02 && Screen changed && Screen == 0x03"
  - name: Stage 1-3 (Boss Fight) start
    when: "Stage == 0x04 && Stage changed || Stage == 0x04 && GameState was 0x00 && GameState == 0x01"
    start: yes
    no_rewind: easy
  - name: Stage 1-3 (Boss Fight) boss 75%
    when: "Stage == 0x04 && Stage == 0x04 && Stage was == 0x04 && BossHealth was > 0x0C && BossHealth was != 0xFF && BossHealth <= 0x0C"
    levels: medium
  - name: Stage 1-3 (Boss Fight) boss 50%
    when: "Stage == 0x04 && Stage == 0x04 && Stage was == 0x04 && BossHealth was > 0x08 && BossHealth was != 0xFF && BossHealth <= 0x08"
    levels: medium hard
  - name: Stage 1-3 (Boss Fight) boss 25%
    when: "Stage == 0x04 && Stage == 0x04 && Stage was == 0x04 && BossHealth was > 0x04 && BossHealth was != 0xFF && BossHealth <= 0x04"
    levels: medium
