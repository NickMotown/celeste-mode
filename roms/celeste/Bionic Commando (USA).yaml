# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 6228M (Zed_Shift, all items), on Bionic Commando (USA), BizHawk .bk2 replayed in FCEUX 2.6.6, input 1 frame later.
variables:
  0x004A: Lives
  0x004C: Room
  0x004D: Area
  0x0065: Mode
  0x00A9: Screen
  0x00D1: BossRoom
  0x0647: PlayerState
  0x0779: Health
name: Bionic Commando (USA)
rom: nes/Bionic Commando (USA).nes
hit:
  - "PlayerState changed && PlayerState == 0x02"
  - "PlayerState changed && PlayerState == 0x03"
  - "Health decreased"
  - "Lives decreased"
lives: Lives
mode: checkpoints
checkpoints:
  - name: Area 1 start
    when: "Area == 0x01 && Room == 0x00 && Screen == 0x01 && Mode was 0x0D && Mode == 0x0E"
    start: yes
  - name: Area 1 5
    when: "Area == 0x01 && Screen changed && Room == 0x28 && Screen == 0x01"
    levels: easy medium
  - name: Area 1 9
    when: "Area == 0x01 && Screen changed && Room == 0x00 && Screen == 0x03"
  - name: Area 1 12
    when: "Area == 0x01 && Screen changed && Room == 0x47 && Screen == 0x00"
    levels: easy medium
