# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 6630M (scrimpeh, no subweapons, no damage), on Castlevania (USA) (Rev A), replayed in FCEUX 2.6.6.
variables:
  0x0018: State
  0x0028: Stage
  0x002A: Lives
  0x002F: Screen
  0x0045: Health
  0x0046: Floor
  0x00F7: Pad
  0x01A9: BossHealth
name: Castlevania (USA) (Rev A)
rom: nes/Castlevania (USA) (Rev A).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
keep:
  - 0x0080-0x00BF
  - 0x00E0-0x00EF
song: 0x0089
mode: checkpoints
checkpoints:
  - name: Stage 1 start
    when: "Stage == 0x00 && Screen == 0x00 && Floor == 0x00 && State changed && State == 0x05"
    start: yes
  - name: Stage 2 start
    when: "Stage == 0x01 && Screen == 0x00 && Floor == 0x00 && State changed && State == 0x05"
    start: yes
  - name: Stage 2 4
    when: "Stage == 0x01 && Screen changed && Screen == 0x02 && Floor == 0x00"
    levels: easy medium
  - name: Stage 3 start
    when: "Stage == 0x02 && Screen == 0x00 && Floor == 0x01 && State changed && State == 0x05"
    start: yes
  - name: Stage 3 4
    when: "Stage == 0x02 && Screen changed && Screen == 0x01 && Floor == 0x00"
    wait: 0
  - name: Stage 3 6
    when: "Stage == 0x02 && Screen changed && Screen == 0x02 && Floor == 0x01"
    wait: 0
  - name: Stage 4 start
    when: "Stage == 0x03 && Screen == 0x00 && Floor == 0x00 && State changed && State == 0x05"
    start: yes
  - name: Stage 4 boss room
    when: "Stage == 0x03 && Screen changed && Screen == 0x02 && Floor == 0x00"
    wait: 0
    no_rewind: easy
  - name: Stage 4 boss 75%
    when: "Stage == 0x03 && BossHealth was > 0x30 && BossHealth was != 0xFF && BossHealth <= 0x30"
    levels: medium
  - name: Stage 4 boss 50%
    when: "Stage == 0x03 && BossHealth was > 0x20 && BossHealth was != 0xFF && BossHealth <= 0x20"
    levels: medium hard
  - name: Stage 4 boss 25%
    when: "Stage == 0x03 && BossHealth was > 0x10 && BossHealth was != 0xFF && BossHealth <= 0x10"
    levels: medium
