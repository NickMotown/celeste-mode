# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 3010M (Tiancaiwhr), on Mega Man 4 (USA) (PRG0), header-less MD5 db45eb9413964295adb8d1da961807cc, replayed in FCEUX 2.6.6.
variables:
  0x0016: Pad
  0x0022: Stage
  0x0028: Screen
  0x0030: Move
  0x00A1: Lives
  0x00B0: Health
  0x00BF: BossHealth
  0x0132: BossBar
name: Mega Man 4 (USA) (Rev A)
rom: nes/Mega Man 4 (USA) (Rev A).nes
hit:
  - "Move changed && Move == 0x07"
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
input_bits: right left down up start select b a
patches:
  - name: all weapons and Cossack
    button: select
    patch: "set 0x00A9 to 0xFF; set 0x00B1 to 0x9C; set 0x00B2 to 0x9C; set 0x00B3 to 0x9C; set 0x00B4 to 0x9C; set 0x00B5 to 0x9C; set 0x00B6 to 0x9C; set 0x00B7 to 0x9C; set 0x00B8 to 0x9C; set 0x00B9 to 0x9C; set 0x00BA to 0x9C; set 0x00BB to 0x9C; set 0x00BC to 0x9C; set 0x00BD to 0x9C"
keep:
  - 0x00C0-0x00E3
  - 0x0700-0x077F
song: 0x00C5-0x00C6
mode: checkpoints
checkpoints:
