# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 9518S (glitchless, Yoshikiller109 & Evllnk2565), on Rockman (Japan) (En), header-less MD5 8d5a61f42d92ee61d05083263a11fca1, replayed in FCEUX 2.6.6.
variables:
  0x0014: Pad
  0x001B: Screen
  0x002C: Footing
  0x0031: Stage
  0x0059: PlayState
  0x006A: Health
  0x00A6: Lives
  0x0400: Sprite
  0x0480: PlayerX
  0x055E: Song
  0x057C: BossMusic
  0x0600: PlayerY
  0x06C1: BossHealth
name: Mega Man (USA)
rom: nes/Mega Man (USA).nes
hit:
  - "Health decreased"
  - "PlayerY was >= 0xC0 && PlayerY == 0xF8 && PlayState == 0x05"
  - "Lives decreased"
lives: Lives
input: Pad
input_bits: a b select start up down left right
patches:
  - name: all weapons and Wily (title or game over)
    button: select
    when: "Stage == 0x0A"
    patch: "set 0x005D to 0xFE; set 0x006B to 0x1C; set 0x006C to 0x1C; set 0x006D to 0x1C; set 0x006E to 0x1C; set 0x006F to 0x1C; set 0x0070 to 0x1C; set 0x0071 to 0x1C"
  - name: all weapons and Wily (stage select)
    button: select
    when: "0x0036 == 0xBD"
    patch: "set 0x005D to 0xFE; set 0x006B to 0x1C; set 0x006C to 0x1C; set 0x006D to 0x1C; set 0x006E to 0x1C; set 0x006F to 0x1C; set 0x0070 to 0x1C; set 0x0071 to 0x1C"
keep:
  - 0x00E0-0x00EF
  - 0x00F1-0x00F7
  - 0x0500-0x057F
song: Song
mode: checkpoints
checkpoints:
  - name: Guts Man start
    when: "Stage == 0x05 && Sprite was 0x14 && Sprite != 0x14"
    start: yes
  - name: Guts Man 2
    when: "Stage == 0x05 && Screen changed && Screen == 0x01"
    levels: easy
  - name: Guts Man 5
    when: "Stage == 0x05 && Screen changed && Screen == 0x04"
    levels: easy medium
    patch: "set PlayerX to PlayerX + 0x18"
  - name: Guts Man 8
    when: "Stage == 0x05 && Screen changed && Screen == 0x07"
    levels: easy
  - name: Guts Man 9
    when: "Stage == 0x05 && Screen changed && Screen == 0x08"
