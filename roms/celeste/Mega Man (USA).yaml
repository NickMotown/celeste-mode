    when: "Stage == 0x05 && Screen changed && Screen == 0x12"
    wait: 0
    no_rewind: easy
  - name: Guts Man boss 75%
    when: "Stage == 0x05 && BossMusic == 0x40 && BossMusic was == 0x40 && BossHealth was > 0x15 && BossHealth was != 0xFF && BossHealth <= 0x15"
    levels: medium
  - name: Guts Man boss 50%
    when: "Stage == 0x05 && BossMusic == 0x40 && BossMusic was == 0x40 && BossHealth was > 0x0E && BossHealth was != 0xFF && BossHealth <= 0x0E"
    levels: medium hard
