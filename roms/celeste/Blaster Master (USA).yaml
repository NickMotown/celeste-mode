# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 2273M (bothermojo1), on Blaster Master (USA), replayed in FCEUX 2.6.6.
variables:
  0x0014: Area
  0x001D: CameraX
  0x001F: CameraY
  0x00D5: Room
  0x00DD: Lives
  0x00DE: Pad
  0x0400: PlayerState
  0x040D: Health
name: Blaster Master (USA)
rom: nes/Blaster Master (USA).nes
hit:
  - "Health decreased && PlayerState unchanged"
  - "PlayerState changed && PlayerState == 0x04"
  - "PlayerState changed && PlayerState == 0x1C"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Area 1 start
    when: "Area == 0x08 && PlayerState was 0x00 && PlayerState != 0x00 || Area == 0x08 && Room was 0x07 && Room != 0x07 && Room != 0x15 || Area == 0x08 && Area changed && Area < 0x08 || Area == 0x08 && Area changed && Area >= 0x08 && Room changed"
    start: yes
    group: Area 1
  - name: Area 1 4
    when: "Area == 0x08 && CameraX changed && CameraX >= 0x40 && CameraX <= 0x4F && CameraY >= 0x30 && CameraY <= 0x3F"
    levels: easy
    group: Area 1
  - name: Area 1 8
