# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4893M (aiqiyou, J.Y & eien86, BizHawk 2.8, made on the GoodNES (U) [!] dump), converted to .fm2 by movie.py, on Ninja Gaiden II (USA), replayed in FCEUX 2.6.6 in sync.
variables:
  0x0012: Pad
  0x001F: InGame
  0x007E: Area
  0x0080: Health
  0x0081: BossHealth
  0x00A5: Lives
  0x00B6: Part
  0x00B7: Screen
name: Ninja Gaiden II - The Dark Sword of Chaos (USA)
rom: nes/Ninja Gaiden II - The Dark Sword of Chaos (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Area 1 start
    when: "Area == 0x00 && Screen == 0x00 && Health was 0x00 && Health == 0x10"
    start: yes
  - name: Area 2 start
    when: "Area == 0x01 && Area changed || Area == 0x01 && Health was 0x00 && Health == 0x10"
    start: yes
  - name: Area 3 start
