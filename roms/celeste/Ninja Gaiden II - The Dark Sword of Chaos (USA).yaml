    start: yes
  - name: Area 4 boss room
    when: "Area == 0x03 && Screen changed && Screen == 0x00"
    wait: 0
    no_rewind: easy
  - name: Area 4 boss 75%
    when: "Area == 0x03 && BossHealth was > 0x0C && BossHealth was != 0xFF && BossHealth <= 0x0C"
    levels: medium
  - name: Area 4 boss 50%
    when: "Area == 0x03 && BossHealth was > 0x08 && BossHealth was != 0xFF && BossHealth <= 0x08"
    levels: medium hard
