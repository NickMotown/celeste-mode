# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 2921M (nitsuja & Alyosha), on Kabuki - Quantum Fighter (USA), replayed in FCEUX 2.6.6.
variables:
  0x00E0: Screen
  0x037E: Pad
  0x04B8: BossHealth
  0x04C4: BossHealth5
  0x068B: Area
  0x068C: Health
  0x06C0: Lives
name: Kabuki - Quantum Fighter (USA)
rom: nes/Kabuki - Quantum Fighter (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Area 0 start
    when: "Area == 0x00 && Screen was 0xFF && Screen == 0x00"
    start: yes
  - name: Area 0 4
    when: "Area == 0x00 && Screen changed && Screen == 0x02"
    levels: easy medium
  - name: Area 0 6
    when: "Area == 0x00 && Screen changed && Screen == 0x04"
  - name: Area 0 9
    when: "Area == 0x00 && Screen changed && Screen == 0x07"
    levels: easy medium
  - name: Area 0 11
    when: "Area == 0x00 && Screen changed && Screen == 0x09"
  - name: Area 0 13
    when: "Area == 0x00 && Screen changed && Screen == 0x0B"
    levels: easy
  - name: Area 0 15
    when: "Area == 0x00 && Screen changed && Screen == 0x0D"
    levels: easy medium
  - name: Area 1 start
    when: "Area == 0x01 && Screen == 0x0E && Area changed"
    start: yes
    no_rewind: easy
  - name: Area 1 boss room
    when: "Area == 0x01 && Screen changed && Screen == 0x00"
    wait: 0
    no_rewind: easy
  - name: Area 1 boss 75%
    when: "Area == 0x01 && Area == 0x01 && Area was == 0x01 && BossHealth was > 0x2D && BossHealth was != 0xFF && BossHealth <= 0x2D"
    levels: medium
  - name: Area 1 boss 50%
    when: "Area == 0x01 && Area == 0x01 && Area was == 0x01 && BossHealth was > 0x1E && BossHealth was != 0xFF && BossHealth <= 0x1E"
    levels: medium hard
  - name: Area 1 boss 25%
    when: "Area == 0x01 && Area == 0x01 && Area was == 0x01 && BossHealth was > 0x0F && BossHealth was != 0xFF && BossHealth <= 0x0F"
    levels: medium
  - name: Area 2 start
    when: "Area == 0x02 && 0x06C7 changed && 0x06C7 == 0x9E"
    start: yes
  - name: Area 2 4
    when: "Area == 0x02 && Screen changed && Screen == 0x02"
    levels: easy
  - name: Area 2 6
    when: "Area == 0x02 && Screen changed && Screen == 0x04"
  - name: Area 2 8
    when: "Area == 0x02 && Screen changed && Screen == 0x06"
    levels: easy
