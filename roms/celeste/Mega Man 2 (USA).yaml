# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4057M (warmCabin, zipless), on Rockman 2 - Dr. Wily no Nazo (Japan), header-less MD5 770d55a19ae91dcaa9560d6aa7321737, replayed in FCEUX 2.6.6 (its .fm3 made a text .fm2 by movie.py --fm2).
variables:
  0x0023: Pad
  0x002A: Stage
  0x00A8: Lives
  0x0400: Sprite
  0x0440: Screen
  0x0460: PlayerX
  0x04A0: PlayerY
  0x055E: Song
  0x0580: PlayerFlags
  0x0640: YSpeed
  0x0660: YSubSpeed
  0x06C0: Health
  0x06C1: BossHealth
name: Mega Man 2 (USA)
rom: nes/Mega Man 2 (USA).nes
hit:
  - "PlayerFlags changed && PlayerFlags == 0x41 && Song was < 0xAC"
  - "Health decreased"
  - "Lives decreased"
lives: Lives
lives_floor: 2
input: Pad
input_bits: a b select start up down left right
patches:
  - name: all weapons and Wily
    button: select
    patch: "set 0x009A to 0xFF; set 0x009C to 0x1C; set 0x009D to 0x1C; set 0x009E to 0x1C; set 0x009F to 0x1C; set 0x00A0 to 0x1C; set 0x00A1 to 0x1C; set 0x00A2 to 0x1C; set 0x00A3 to 0x1C; set 0x009B to 0x07; set 0x00A4 to 0x1C; set 0x00A5 to 0x1C; set 0x00A6 to 0x1C"
keep:
  - 0x0500-0x05FF
song: "Song & 0xFC"
mode: checkpoints
checkpoints:
  - name: Quick Man start
    when: "Stage == 0x04 && Screen == 0x00 && Sprite was 0x1A && Sprite != 0x1A"
    start: yes
  - name: Quick Man 2
    when: "Stage == 0x04 && Screen changed && Screen == 0x01"
    wait: 0
