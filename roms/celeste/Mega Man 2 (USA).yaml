    no_rewind: easy
  - name: Quick Man boss 75%
    when: "Stage == 0x04 && Song >= 0xAC && Song <= 0xAF && Song was >= 0xAC && Song was <= 0xAF && BossHealth was > 0x15 && BossHealth was != 0xFF && BossHealth <= 0x15"
    levels: medium
  - name: Quick Man boss 50%
    when: "Stage == 0x04 && Song >= 0xAC && Song <= 0xAF && Song was >= 0xAC && Song was <= 0xAF && BossHealth was > 0x0E && BossHealth was != 0xFF && BossHealth <= 0x0E"
    levels: medium hard
