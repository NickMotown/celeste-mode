# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4751M (eien86 & Scumtron, BizHawk 2.8), converted to .fm2 by movie.py, on Ninja Gaiden (USA), replayed in FCEUX 2.6.6, input delayed 1 frame (FCEUX starts reading the pad a frame later than BizHawk).
variables:
  0x0028: Pad
  0x002B: Fade
  0x0052: Screen
  0x005C: Mode
  0x0065: Health
  0x0066: BossHealth
  0x006D: Stage
  0x006E: Room
  0x0076: Lives
name: Ninja Gaiden (USA)
rom: nes/Ninja Gaiden (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Stage 1-1 start
    when: "Room == 0x00 && Screen == 0x00 && Room changed"
    start: yes
  - name: Stage 1-1 3
    when: "Room == 0x00 && Screen changed && Screen == 0x02"
    levels: easy
  - name: Stage 1-1 6
    when: "Room == 0x00 && Screen changed && Screen == 0x05"
  - name: Stage 1-1 9
    when: "Room == 0x00 && Screen changed && Screen == 0x08"
    levels: easy medium
  - name: Stage 1-2 boss start
    when: "Room == 0x01 && Screen == 0x00 && Fade was 0x24 && Fade == 0x00"
    start: yes
  - name: Stage 1-2 boss boss 75%
    when: "Room == 0x01 && BossHealth was > 0x0C && BossHealth was != 0xFF && BossHealth <= 0x0C"
    levels: medium
  - name: Stage 1-2 boss boss 50%
    when: "Room == 0x01 && BossHealth was > 0x08 && BossHealth was != 0xFF && BossHealth <= 0x08"
    levels: medium hard
  - name: Stage 1-2 boss boss 25%
    when: "Room == 0x01 && BossHealth was > 0x04 && BossHealth was != 0xFF && BossHealth <= 0x04"
    levels: medium
  - name: Stage 1-2 boss boss fight
