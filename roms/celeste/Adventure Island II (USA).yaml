# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 1866M (Red-Crowned Crane, hellagels1), on Hudson's Adventure Island 2 (U), replayed in FCEUX 2.6.6.
variables:
  0x003E: LevelEnd
  0x0067: Pad
  0x0076: Struck
  0x007C: Ride
  0x00B3: ScreenX
  0x00B5: ScreenY
  0x00D2: Stage
  0x053A: Song
  0x07D2: Lives
name: Adventure Island II (USA)
rom: nes/Adventure Island II (USA).nes
hit:
  - "Struck increased"
  - "Ride changed && Ride == 0x00 && LevelEnd == 0x00"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: World 1-1 start
    when: "Stage == 0x15 && ScreenX == 0x01 && ScreenY == 0x01 && LevelEnd was 0x03 && LevelEnd == 0x00"
    start: yes
