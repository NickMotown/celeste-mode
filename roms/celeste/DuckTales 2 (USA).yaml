# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 7098M (mcbobx, best ending), on DuckTales 2 (USA), replayed in FCEUX 2.6.6.
variables:
  0x0022: Pad
  0x008B: Area
  0x0097: ScreenX
  0x009A: ScreenY
  0x00B9: BossHealth
  0x00C7: Event
  0x00C8: Stage
  0x00CE: Lives
  0x00CF: Health
name: DuckTales 2 (USA)
rom: nes/DuckTales 2 (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
