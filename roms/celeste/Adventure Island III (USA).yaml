# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4462M (J.Y), on Hudson's Adventure Island 3 (U), replayed in FCEUX 2.6.6.
variables:
  0x0067: Pad
  0x0076: Struck
  0x0078: StageState
  0x007C: Ride
  0x00B3: Screen
  0x00D0: World
  0x00D1: Area
  0x0394: Lives
name: Adventure Island III (USA)
rom: nes/Adventure Island III (USA).nes
hit:
  - "Struck changed && Struck == 0x01"
  - "Lives decreased by 1"
  - "Ride changed && Ride == 0x00 && StageState == 0x01"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
