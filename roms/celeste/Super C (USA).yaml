# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 3239M (xipo, feos, koh1fds, 1 player), on Super C (USA), replayed in FCEUX 2.6.6.
variables:
  0x0016: Section
  0x0038: GameScreen
  0x0050: Area
  0x0053: Lives
  0x0074: ScrollHigh
  0x00A0: PlayerState
  0x00F3: Pad
  0x010A: Song
  0x0518: PlayerSprite
name: Super C (USA)
rom: nes/Super C (USA).nes
hit:
  - "PlayerState was 0x02 && PlayerState >= 0x03 && PlayerState <= 0x05"
lives: Lives
input: Pad
keep:
  - 0x0100-0x010F
  - 0x0128-0x0137
  - 0x0158-0x016F
  - 0x0188-0x01BF
  - 0x00E0-0x00EF
  - 0x0023
  - 0x07E9
song: Song
mode: checkpoints
checkpoints:
  - name: Area 1 start
    when: "Area == 0x00 && GameScreen was 0x02 && GameScreen == 0x03"
    start: yes
  - name: Area 1 3
    when: "Area == 0x00 && Section changed && Section == 0x02 && ScrollHigh == 0x02"
    levels: easy
  - name: Area 1 4
    when: "Area == 0x00 && Section changed && Section == 0x03 && ScrollHigh == 0x02"
  - name: Area 1 5
    when: "Area == 0x00 && Section changed && Section == 0x04 && ScrollHigh == 0x02"
    levels: easy medium
  - name: Area 1 6
    when: "Area == 0x00 && Section changed && Section == 0x05 && ScrollHigh == 0x02"
    levels: easy
  - name: Area 1 8
    when: "Area == 0x00 && Section changed && Section == 0x06 && ScrollHigh == 0x01"
  - name: Area 1 9
    when: "Area == 0x00 && Section changed && Section == 0x07 && ScrollHigh == 0x01"
    levels: easy medium
  - name: Area 1 10
    when: "Area == 0x00 && Section changed && Section == 0x08 && ScrollHigh == 0x01"
  - name: Area 1 11
