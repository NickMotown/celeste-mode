# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 369M (Foda), on Street Fighter 2010 (USA), FCEU .fcm replayed in FCEUX 2.6.6.
variables:
  0x0010: Pad
  0x0019: Screen
  0x00AB: Stage
  0x00B1: Life
  0x00B5: Lives
  0x0400: Action
name: Street Fighter 2010 - The Final Fight (USA)
rom: nes/Street Fighter 2010 - The Final Fight (USA).nes
hit:
  - "Life decreased"
  - "Action changed && Action == 0x0E"
  - "Lives decreased by 1"
death:
  - "0x0400 changed && 0x0400 == 0x0E"
lives: Lives
input: Pad
input_bits: a b select start up down left right
mode: checkpoints
checkpoints:
  - name: Stage 1 start
    when: "Stage == 0x00 && Screen == 0x00 && Action was 0x0F && Action == 0x00"
    start: yes
  - name: Stage 1 2
    when: "Stage == 0x00 && Screen changed && Screen == 0x01"
  - name: Stage 2 start
    when: "Stage == 0x01 && Screen == 0x00 && Action was 0x0F && Action == 0x00"
    start: yes
  - name: Stage 3 start
