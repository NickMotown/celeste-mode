# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 3066M (glitchman), on Mega Man 6 (USA), replayed in FCEUX 2.6.6.
variables:
  0x0005: StageIntro
  0x0040: Pad
  0x0051: Stage
  0x0057: Screen
  0x00A9: Lives
  0x03E5: Health
  0x03ED: BossHealth
  0x0642: BossFight
  0x067C: OnGround
name: Mega Man 6 (USA)
rom: nes/Mega Man 6 (USA).nes
hit:
  - "Health decreased && Health was <= 0x1C && Health != 0x00"
  - "Health decreased && Health was <= 0x1C && Health == 0x00 && BossHealth unchanged"
  - "Health > 0x1C && Health was < 0x10"
  - "Lives decreased"
lives: Lives
input: Pad
input_bits: right left down up start select b a
patches:
  - name: all weapons and the centre open
    button: select
    when: "0x019C == 0x9F && Stage != 0x08"
    patch: "set 0x05C8 to 0x00; set 0x0688 to 0x9C; set 0x0689 to 0x9C; set 0x068A to 0x9C; set 0x068B to 0x9C; set 0x068C to 0x9C; set 0x068D to 0x9C; set 0x068E to 0x9C; set 0x068F to 0x9C; set 0x0690 to 0x9C; set 0x0691 to 0x9C; set 0x0692 to 0x9C; set 0x0693 to 0x9C"
  - name: Wily from the fortress map
    button: select
    when: "0x019C == 0x9F && Stage == 0x08"
    patch: "set 0x0051 to 0x0C"
keep:
  - 0x0700-0x077F
song: 0x00C5-0x00C6
mode: checkpoints
checkpoints:
