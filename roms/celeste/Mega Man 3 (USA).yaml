# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 2439M (Pike, Tiancaiwhr), on Rockman 3 - Dr. Wily no Saigo! (Japan), header-less MD5 4f168c40ef35e5a0f4256d707067526f, replayed in FCEUX 2.6.6.
variables:
  0x0016: Pad
  0x0022: Stage
  0x0030: Move
  0x00A2: Health
  0x00AE: Lives
  0x00B3: BossBar
  0x0380: Screen
  0x04FE: BossHealth2
  0x04FF: BossHealth
name: Mega Man 3 (USA)
rom: nes/Mega Man 3 (USA).nes
hit:
  - "Move changed && Move == 0x0E"
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
input_bits: right left down up start select b a
patches:
  - name: all weapons and the Doc Robot stages
    button: select
    when: "0x0060 != 0x09"
    patch: "set 0x0060 to 0x09; set 0x0061 to 0x00; set 0x00A3 to 0x9C; set 0x00A4 to 0x9C; set 0x00A5 to 0x9C; set 0x00A6 to 0x9C; set 0x00A7 to 0x9C; set 0x00A8 to 0x9C; set 0x00A9 to 0x9C; set 0x00AA to 0x9C; set 0x00AB to 0x9C; set 0x00AC to 0x9C; set 0x00AD to 0x9C"
  - name: all weapons and Break Man in the centre
    button: select
    when: "0x0060 == 0x09"
    patch: "set 0x0060 to 0x12; set 0x00A3 to 0x9C; set 0x00A4 to 0x9C; set 0x00A5 to 0x9C; set 0x00A6 to 0x9C; set 0x00A7 to 0x9C; set 0x00A8 to 0x9C; set 0x00A9 to 0x9C; set 0x00AA to 0x9C; set 0x00AB to 0x9C; set 0x00AC to 0x9C; set 0x00AD to 0x9C"
keep:
  - 0x00C0-0x00E3
  - 0x0700-0x077F
song: 0x00C5-0x00C6
mode: checkpoints
