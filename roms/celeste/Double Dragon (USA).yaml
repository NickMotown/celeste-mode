# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 3211M (Alyosha), on Double Dragon (USA), replayed in FCEUX 2.6.6.
variables:
  0x003D: Mission
  0x003E: Room
  0x003F: Screen
  0x0043: Lives
  0x00F7: Pad
  0x03B4: Health
name: Double Dragon (USA)
rom: nes/Double Dragon (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Mission 1 start
    when: "Mission == 0x00 && Screen == 0x00 && Room == 0x00 && Health was 0x00 && Health == 0x40"
    start: yes
  - name: Mission 1 2
    when: "Mission == 0x00 && Screen changed && Screen == 0x01 && Room == 0x00"
  - name: Mission 1 3
    when: "Mission == 0x00 && Screen changed && Screen == 0x02 && Room == 0x00"
  - name: Mission 1 4
    when: "Mission == 0x00 && Screen changed && Screen == 0x03 && Room == 0x00"
  - name: Mission 1 6
    when: "Mission == 0x00 && Screen changed && Screen == 0x00 && Room == 0x01"
    wait: 0
  - name: Mission 1 7
    when: "Mission == 0x00 && Screen changed && Screen == 0x01 && Room == 0x01"
    levels: easy
  - name: Mission 2 start
    when: "Mission == 0x01 && Screen == 0x00 && Room == 0x00 && Mission changed"
    start: yes
  - name: Mission 2 2
    when: "Mission == 0x01 && Screen changed && Screen == 0x01 && Room == 0x00"
  - name: Mission 2 3
    when: "Mission == 0x01 && Screen changed && Screen == 0x02 && Room == 0x00"
  - name: Mission 2 4
    when: "Mission == 0x01 && Screen changed && Screen == 0x03 && Room == 0x00"
  - name: Mission 3 start
    when: "Mission == 0x02 && Screen == 0x00 && Room == 0x00 && Mission changed"
    start: yes
  - name: Mission 3 2
    when: "Mission == 0x02 && Screen changed && Screen == 0x01 && Room == 0x00"
  - name: Mission 3 3
    when: "Mission == 0x02 && Screen changed && Screen == 0x02 && Room == 0x00"
  - name: Mission 3 4
    when: "Mission == 0x02 && Screen changed && Screen == 0x03 && Room == 0x00"
  - name: Mission 3 5
    when: "Mission == 0x02 && Screen changed && Screen == 0x04 && Room == 0x00"
  - name: Mission 3 7
    when: "Mission == 0x02 && Screen changed && Screen == 0x00 && Room == 0x01"
    wait: 0
  - name: Mission 3 8
    when: "Mission == 0x02 && Screen changed && Screen == 0x01 && Room == 0x01"
    levels: easy medium
  - name: Mission 3 9
    when: "Mission == 0x02 && Screen changed && Screen == 0x02 && Room == 0x01"
  - name: Mission 3 11
    when: "Mission == 0x02 && Screen changed && Screen == 0x00 && Room == 0x02"
    wait: 0
  - name: Mission 3 12
    when: "Mission == 0x02 && Screen changed && Screen == 0x01 && Room == 0x02"
  - name: Mission 3 15
    when: "Mission == 0x02 && Screen changed && Screen == 0x04 && Room == 0x02"
    levels: easy medium
  - name: Mission 3 17
    when: "Mission == 0x02 && Screen changed && Screen == 0x00 && Room == 0x03"
    wait: 0
  - name: Mission 3 18
    when: "Mission == 0x02 && Screen changed && Screen == 0x01 && Room == 0x03"
    levels: easy
  - name: Mission 4 start
    when: "Mission == 0x03 && Screen == 0x00 && Room == 0x00 && Mission changed"
    start: yes
  - name: Mission 4 2
    when: "Mission == 0x03 && Screen changed && Screen == 0x01 && Room == 0x00"
    levels: easy medium
  - name: Mission 4 3
    when: "Mission == 0x03 && Screen changed && Screen == 0x02 && Room == 0x00"
  - name: Mission 4 4
    when: "Mission == 0x03 && Screen changed && Screen == 0x04 && Room == 0x00"
    levels: easy medium
  - name: Mission 4 6
    when: "Mission == 0x03 && Screen changed && Screen == 0x00 && Room == 0x01"
    wait: 0
  - name: Mission 4 7
    when: "Mission == 0x03 && Room changed && Screen == 0x00 && Room == 0x02"
    wait: 0
  - name: Mission 4 8
    when: "Mission == 0x03 && Screen changed && Screen == 0x01 && Room == 0x02"
  - name: Mission 4 9
    when: "Mission == 0x03 && Screen changed && Screen == 0x02 && Room == 0x02"
  - name: Mission 4 10
    when: "Mission == 0x03 && Screen changed && Screen == 0x03 && Room == 0x02"
    levels: easy medium
  - name: Mission 4 12
    when: "Mission == 0x03 && Screen changed && Screen == 0x05 && Room == 0x02"
  - name: Mission 4 13
    when: "Mission == 0x03 && Screen changed && Screen == 0x06 && Room == 0x02"
