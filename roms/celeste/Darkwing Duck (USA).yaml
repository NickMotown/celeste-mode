# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4739M (DreamYao, J.Y & aiqiyou), on Darkwing Duck (USA), replayed in FCEUX 2.6.6.
variables:
  0x0016: Pad
  0x0022: Screen
  0x0027: Section
  0x0031: Level
  0x0050: State
  0x00D9: Music
  0x00EE: BossHits
name: Darkwing Duck (USA)
rom: nes/Darkwing Duck (USA).nes
hit:
  - "State changed && State == 0x06"
  - "0x0050 changed && 0x0050 == 0x07"
death:
  - "0x0050 changed && 0x0050 == 0x07"
input: Pad
input_bits: right left down up start select b a
mode: checkpoints
checkpoints:
  - name: Liquidator start
    when: "Level == 0x02 && Screen == 0x00 && State was 0x09 && State != 0x09"
    start: yes
