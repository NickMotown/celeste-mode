# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 7309M (FourLi39 & Rum, damageless), on Ninja Gaiden III (USA), replayed in FCEUX 2.6.6.
variables:
  0x0012: Pad
  0x005F: Area
  0x0070: Progress
  0x0085: Screen
  0x00A7: Health
  0x00A8: BossHealth
  0x00C4: Lives
name: Ninja Gaiden III - The Ancient Ship of Doom (USA)
rom: nes/Ninja Gaiden III - The Ancient Ship of Doom (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Area 1 start
    when: "Area == 0x01 && Screen == 0x04 && Area changed"
    start: yes
  - name: Area 1 4
    when: "Area == 0x01 && Screen changed && Screen == 0x00"
  - name: Area 2 start
    when: "Area == 0x02 && Screen == 0x00 && Area changed"
    start: yes
  - name: Area 3 start
    when: "Area == 0x03 && Screen == 0x01 && Area changed"
    start: yes
  - name: Area 3 boss room
    when: "Area == 0x03 && Screen changed && Screen == 0x00"
    wait: 0
    no_rewind: easy
  - name: Area 3 boss 75%
    when: "Area == 0x03 && BossHealth was > 0x0C && BossHealth was != 0xFF && BossHealth <= 0x0C"
    levels: medium
  - name: Area 3 boss 50%
    when: "Area == 0x03 && BossHealth was > 0x08 && BossHealth was != 0xFF && BossHealth <= 0x08"
    levels: medium hard
  - name: Area 3 boss 25%
    when: "Area == 0x03 && BossHealth was > 0x04 && BossHealth was != 0xFF && BossHealth <= 0x04"
    levels: medium
