# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 1816M (aglar, 1 player), on Chip 'n Dale Rescue Rangers (USA), replayed in FCEUX 2.6.6.
variables:
  0x0016: Pad
  0x002C: InZone
  0x0031: Zone
  0x005E: Hit
  0x006E: Region
  0x00FD: Screen
  0x04D0: Alive
name: Chip 'n Dale Rescue Rangers (USA)
rom: nes/Chip 'n Dale Rescue Rangers (USA).nes
hit:
  - "Hit was 0x00 && Hit != 0x00"
input: Pad
mode: checkpoints
checkpoints:
  - name: Zone A start
    when: "Zone == 0x00 && InZone was 0x00 && InZone != 0x00 && Zone <= 0x0A"
    start: yes
  - name: Zone A 3
    when: "Zone == 0x00 && Screen changed && Screen == 0x02 && Region == 0x00"
    levels: easy
  - name: Zone A 4
    when: "Zone == 0x00 && Screen changed && Screen == 0x03 && Region == 0x00"
    levels: easy
  - name: Zone A 6
    when: "Zone == 0x00 && Screen changed && Screen == 0x05 && Region == 0x00"
