# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4469M (dreamyao), on Ghosts 'N Goblins (U), replayed in FCEUX 2.6.6.
variables:
  0x0042: Pad
  0x006D: Screen
  0x0070: Floor
  0x00AC: Stage
  0x00C9: Clear
  0x00D6: HitFlag
  0x00F8: Song
  0x013C: State
  0x0647: Invincible
  0x0715: Lives
name: Ghosts'n Goblins (USA)
rom: nes/Ghosts'n Goblins (USA).nes
hit:
  - "Invincible changed && Invincible == 0x01"
  - "Invincible decreased && Invincible == 0x00 && HitFlag == 0x60"
  - "Lives decreased"
lives: Lives
lives_floor: 2
input: Pad
mode: checkpoints
checkpoints:
  - name: Level 1 start
    when: "Stage == 0x00 && Screen == 0x00 && Floor == 0x00 && State changed && State == 0x04"
    start: yes
  - name: Level 1 3
    when: "Stage == 0x00 && Screen changed && Screen == 0x02 && Floor == 0x00"
    levels: easy
  - name: Level 1 5
    when: "Stage == 0x00 && Screen changed && Screen == 0x04 && Floor == 0x00"
  - name: Level 1 7
    when: "Stage == 0x00 && Screen changed && Screen == 0x06 && Floor == 0x00"
    levels: easy
  - name: Level 1b start
    when: "Stage == 0x01 && Screen == 0x07 && Floor == 0x00 && Stage changed && State == 0x04"
    start: yes
  - name: Level 1c start
    when: "Stage == 0x02 && Screen == 0x0B && Floor == 0x00 && Stage changed && State == 0x04"
    start: yes
  - name: Level 1c boss room
    when: "Stage == 0x02 && Screen changed && Screen == 0x0C && Floor == 0x00"
    wait: 0
  - name: Level 2 start
    when: "Stage == 0x03 && Screen == 0x00 && Floor == 0x01 && State changed && State == 0x04"
    start: yes
  - name: Level 2 2
    when: "Stage == 0x03 && Floor changed && Screen == 0x00 && Floor == 0x00"
    wait: 0
  - name: Level 2 3
    when: "Stage == 0x03 && Screen changed && Screen == 0x01 && Floor == 0x00"
    levels: easy
  - name: Level 2b start
    when: "Stage == 0x04 && Screen == 0x04 && Floor == 0x00 && Stage changed && State == 0x04"
    start: yes
  - name: Level 2b 3
    when: "Stage == 0x04 && Screen changed && Screen == 0x06 && Floor == 0x00"
    levels: easy medium
  - name: Level 2b 4
    when: "Stage == 0x04 && Screen changed && Screen == 0x07 && Floor == 0x00"
    levels: easy medium
  - name: Level 2c start
    when: "Stage == 0x05 && Screen == 0x09 && Floor == 0x00 && Stage changed && State == 0x04"
    start: yes
  - name: Level 2c 2
    when: "Stage == 0x05 && Screen changed && Screen == 0x0A && Floor == 0x00"
    levels: easy
  - name: Level 2d start
    when: "Stage == 0x06 && Screen == 0x0C && Floor == 0x00 && Stage changed && State == 0x04"
    start: yes
  - name: Level 3 start
    when: "Stage == 0x07 && Screen == 0x00 && Floor == 0x03 && State changed && State == 0x04"
    start: yes
  - name: Level 3 2
    when: "Stage == 0x07 && Screen changed && Screen == 0x01 && Floor == 0x03"
    levels: easy
  - name: Level 3 3
    when: "Stage == 0x07 && Screen changed && Screen == 0x02 && Floor == 0x03"
    levels: easy medium
  - name: Level 3b start
    when: "Stage == 0x08 && Screen == 0x04 && Floor == 0x03 && Stage changed && State == 0x04"
    start: yes
  - name: Level 3b 2
    when: "Stage == 0x08 && Floor changed && Screen == 0x04 && Floor == 0x02"
    wait: 0
  - name: Level 3b 4
    when: "Stage == 0x08 && Screen changed && Screen == 0x06 && Floor == 0x02"
    levels: easy
  - name: Level 3b 6
