# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 1549M (glitchman), on Mega Man 5 (U), replayed in FCEUX 2.6.6.
variables:
  0x0016: Pad
  0x002F: BossBar
  0x0030: Move
  0x0069: Screen
  0x006C: Stage
  0x00B0: Health
  0x00BF: Lives
  0x0458: BossHealth
name: Mega Man 5 (USA)
rom: nes/Mega Man 5 (USA).nes
hit:
  - "Move changed && Move == 0x07"
  - "Health decreased"
  - "Lives decreased"
lives: Lives
input: Pad
input_bits: right left down up start select b a
patches:
  - name: all weapons and Wily
    button: select
    patch: "set 0x006E to 0xFF; set 0x006F to 0x0F; set 0x006D to 0xFF; set 0x00B2 to 0x9C; set 0x00B3 to 0x9C; set 0x00B4 to 0x9C; set 0x00B5 to 0x9C; set 0x00B6 to 0x9C; set 0x00B7 to 0x9C; set 0x00B8 to 0x9C; set 0x00B9 to 0x9C; set 0x00BA to 0x9C; set 0x00BB to 0x9C; set 0x00BC to 0x9C"
keep:
  - 0x00C0-0x00E3
  - 0x0700-0x077F
song: 0x00C5-0x00C6
mode: checkpoints
checkpoints:
