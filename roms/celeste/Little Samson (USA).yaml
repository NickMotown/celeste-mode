# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 1091M (klmz, FCEU 0.98.12 .fcm) converted to .fm2 by movie.py, on Little Samson (USA), replayed in FCEUX 2.6.6.
variables:
  0x0025: Pad
  0x002F: Screen
  0x003F: Stage
  0x0050: Character
  0x005C: Scene
  0x0091: Lives
  0x0097: Health
name: Little Samson (USA)
rom: nes/Little Samson (USA).nes
hit:
  - "Health decreased"
  - "Lives decreased"
  - "0x0056 changed && 0x0056 == 0x80"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
  - name: Intro Stage : Kikira The Dragon start
    when: "Stage == 0x03 && Scene was 0x60 && Scene != 0x60"
    start: yes
  - name: Intro Stage : Kikira The Dragon 2
    when: "Stage == 0x03 && Screen changed && Screen == 0x07"
    levels: easy
