# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 4623M (mars608, aiqiyou, 1 player), on Contra (Japan), replayed in FCEUX 2.6.6.
variables:
  0x002C: Routine
  0x0030: Stage
  0x0032: Lives
  0x0064: Screen
  0x0090: PlayerState
  0x00A0: Jump
  0x00F1: Pad
  0x0106: Song
name: Contra (USA)
rom: nes/Contra (USA).nes
hit:
  - "PlayerState changed && PlayerState == 0x02"
  - "Lives decreased by 1"
lives: Lives
input: Pad
keep:
  - 0x0100-0x011F
  - 0x0128-0x012F
  - 0x0140-0x014F
  - 0x0158-0x0167
  - 0x0178-0x017F
  - 0x00E0-0x00EF
  - 0x0034
song: Song
mode: checkpoints
