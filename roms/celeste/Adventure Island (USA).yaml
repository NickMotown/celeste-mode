# Celeste mode rule file: the bytes for a hit, the lives, the pad and the
# music, then the checkpoints, cut from TASVideos 3667M (ktwo), on Adventure Island (USA), BizHawk .bk2 replayed in FCEUX 2.6.6, input 2 frames later.
variables:
  0x0005: Control
  0x0008: Pad
  0x0037: Area
  0x0038: Round
  0x0039: RoundCheckpoint
  0x003A: Screen
  0x003F: Lives
  0x0049: Bonus
  0x0072: Struck
name: Adventure Island (USA)
rom: nes/Adventure Island (USA).nes
hit:
  - "Struck changed && Struck == 0x01"
  - "Struck changed && Struck == 0x02"
  - "Lives decreased by 1"
lives: Lives
input: Pad
mode: checkpoints
checkpoints:
