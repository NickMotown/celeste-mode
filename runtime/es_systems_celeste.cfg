<?xml version="1.0" encoding="UTF-8"?>
<!-- Celeste mode's system. One rule file (.yaml) per game in
     roms\celeste; any hit is a death, a death goes back to the last
     checkpoint. The command runs <RetroBat>\system\celeste\launch.ps1, which
     starts the game through emulatorLauncher with RetroArch and runs the
     watcher beside it. -gameinfo %GAMEINFOXML% (the game's metadata, its
     scraped bezel included, as every stock system passes it) goes through
     launch.ps1 to emulatorLauncher: without it a Celeste game had the NES
     system bezel instead of its own. Only paths relative to RetroBat: the system is portable.
     Installed by the installer, beside EmulationStation's own systems. -->
<systemList>
  <system>
    <name>celeste</name>
    <fullname>Celeste mode</fullname>
    <path>~\..\roms\celeste</path>
    <extension>.yaml</extension>
    <command>conhost.exe --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "%HOME%\..\system\celeste\launch.ps1" %ROM% -gameinfo %GAMEINFOXML% %CONTROLLERSCONFIG%</command>
    <!-- an emulator only so EmulationStation shows the player's options
         (es_features_celeste.cfg): the command never passes it on.
         One core: per-game profile cores were tried and dropped the same
         day (one default emulator, options set). -->
    <emulators>
      <emulator name="celeste">
        <cores>
          <core default="true">celeste</core>
        </cores>
      </emulator>
    </emulators>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
</systemList>
