<?xml version="1.0" encoding="utf-8"?>
<!-- Celeste mode's player options.
     EmulationStation merges every es_features_*.cfg beside its own; the
     `celeste` emulator is the one es_systems_celeste.cfg declares, with
     a single core. Every game shows the three (REWIND TIME and REWIND TO
     SCREEN went with the rewind rule files); one a game cannot use (no
     screen, song or lives byte in its rule file) is ignored at launch and
     logged. ES stores the choices in es_settings.cfg (celeste.<key>, and
     celeste["<rule>.yaml"].<key> for a game); the watcher reads them there
     (Celeste.Options). The switches are ON / OFF choice lists, not the
     switchauto preset: under an option left on AUTO, ES then shows the
     system's value ("Current setting"), and each description names the
     default for when both are AUTO. -->
<features>
  <emulator name="celeste">
    <feature name="CONTINUOUS MUSIC" group="CELESTE MODE" value="continuous_music" description="The music goes on across a rewind. Only games that know their songs. AUTO: ON." order="3">
      <choice name="ON" value="1"/>
      <choice name="OFF" value="0"/>
    </feature>
    <feature name="CHECKPOINTS" group="CELESTE MODE" value="checkpoints" description="Games cut into sequences: a death goes back to the last checkpoint. EASY has the most. Only games made of checkpoints. AUTO: MEDIUM." order="5">
      <choice name="EASY" value="easy"/>
      <choice name="MEDIUM" value="medium"/>
      <choice name="HARD" value="hard"/>
    </feature>
    <feature name="COUNT LIVES" group="CELESTE MODE" value="count_lives" description="The lives show the deaths. OFF: the game's own lives. AUTO: ON." order="4">
      <choice name="ON" value="1"/>
      <choice name="OFF" value="0"/>
    </feature>
  </emulator>
</features>
